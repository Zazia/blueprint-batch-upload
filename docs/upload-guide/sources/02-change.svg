<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><title>一句“传变更”，先对上原图</title><desc>补全工程上下文；核对当前变更任务与上传范围；读取系统图纸和历史改名关系；盘点本次成品及明确的用户说明。逐项明确动作；可靠对应且非取消 → 上传新版；明确新增或取消 → 核对所需材料；找不到原图 → 待核查，不默认新增。只执行已明确部分；无点原图 PACK → 优先批量新版；含点原图 PACK → 精确对应新版；新增、取消材料 → 各自原生入口。核实并列出剩余问题；逐项回读目标、版本和处理结果；报告已传动作、未匹配项与缺件；有阻塞不提交；齐全后检查授权</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007AFF"/></marker></defs><rect width="1080" height="1440" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="60" y="63" font-size="28" font-weight="600" fill="#526176" data-max="990">BLUEPRINT BATCH UPLOAD  /  设计单位上传</text>
