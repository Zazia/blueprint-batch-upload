<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><title>同事传过，也能接着做</title><desc>从系统取得当前清单；采集当前单体、专业的图纸与版本；翻页和范围不全 → 继续补采；没有看到，不代表系统没有。建立可信的本地账本；记录当前图号、目标身份和状态；保留来源与采集范围；只记当前事实，不编造历史。接上本次文件；匹配本次成品与系统已有记录；名称不同 → 核实后建立映射；有多候选 → 只追问有歧义的项。进入本次上传流程；按当前变更或竣工任务继续；回读实际结果，更新账本与报告；本次没提供的图，不据此取消</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007AFF"/></marker></defs><rect width="1080" height="1440" fill="white"/><g font-family="Microsoft YaHei, PingFang SC, sans-serif">
<text x="60" y="63" font-size="28" font-weight="600" fill="#526176" data-max="990">BLUEPRINT BATCH UPLOAD  /  设计单位上传</text>
<text x="60" y="139" font-size="54" font-weight="700" fill="#16283D" data-max="1020">同事传过，也能接着做</text>
<text x="60" y="197" font-size="34" font-weight="400" fill="#526176" data-max="1020">请求 · 没有旧台账，只有这次修改的图</text>
