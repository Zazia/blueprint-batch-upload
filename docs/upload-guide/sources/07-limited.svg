<svg xmlns="http://www.w3.org/2000/svg" width="420" height="826" viewBox="0 0 420 826"><title>只检查或只试传</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647C8F"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Microsoft YaHei, sans-serif"><text x="210" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#263D50">只检查或只试传</text>
<rect x="10" y="48" width="400" height="221" rx="8" fill="#F8FAFC" stroke="#C6D3DD"/><text x="24" y="73" font-size="14" font-weight="600" fill="#23577D">1 确定允许范围</text>
<rect x="10" y="299" width="400" height="119" rx="8" fill="#F8FAFC" stroke="#C6D3DD"/><text x="24" y="324" font-size="14" font-weight="600" fill="#23577D">2 按要求规划</text>
<rect x="10" y="448" width="400" height="119" rx="8" fill="#F8FAFC" stroke="#C6D3DD"/><text x="24" y="473" font-size="14" font-weight="600" fill="#23577D">3 执行允许的工作</text>
<rect x="10" y="597" width="400" height="197" rx="8" fill="#F8FAFC" stroke="#C6D3DD"/><text x="24" y="622" font-size="14" font-weight="600" fill="#23577D">4 说明做到哪里</text>
<path data-edge="a-b" d="M210 149 V166.28 H210 V185" fill="none" stroke="#647C8F" stroke-width="1.1" marker-end="url(#arrow)"/>
<path data-edge="b-c" d="M210 251 V263 H16 V334 H112 V342" fill="none" stroke="#647C8F" stroke-width="1.1" marker-end="url(#arrow)"/>
<path data-edge="b-d" d="M210 251 V294.68 H308 V342" fill="none" stroke="#647C8F" stroke-width="1.1" marker-end="url(#arrow)"/>
<path data-edge="d-e" d="M308 400 V443.68 H210 V491" fill="none" stroke="#647C8F" stroke-width="1.1" marker-end="url(#arrow)"/>
<path data-edge="c-f" d="M112 400 V413 H4 V628 H210 V640" fill="none" stroke="#647C8F" stroke-width="1.1" marker-end="url(#arrow)"/>
<path data-edge="e-f" d="M210 549 V592.68 H210 V640" fill="none" stroke="#647C8F" stroke-width="1.1" marker-end="url(#arrow)"/>
