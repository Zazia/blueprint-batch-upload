<g class="node" data-id="a">
<rect x="94" y="91" width="232" height="58" rx="6" fill="white" stroke="#96A9BB"/>
<text x="210" y="115" text-anchor="middle" font-size="14" fill="#263446">记录指定文件、专业</text>
<text x="210" y="135" text-anchor="middle" font-size="14" fill="#263446">以及不提交等限制</text>
</g>
<g class="node" data-id="b">
<polygon points="210,185 326,218 210,251 94,218" fill="#EEF5FC" stroke="#96A9BB"/>
<text x="210" y="223" text-anchor="middle" font-size="14" fill="#263446">本次允许上传？</text>
</g>
<g class="node" data-id="c">
<rect x="29" y="342" width="166" height="58" rx="6" fill="white" stroke="#96A9BB"/>
<text x="112" y="366" text-anchor="middle" font-size="14" fill="#263446">只做预检</text>
<text x="112" y="386" text-anchor="middle" font-size="14" fill="#263446">不改名、不上传</text>
</g>
<g class="node" data-id="d">
<rect x="225" y="342" width="166" height="58" rx="6" fill="white" stroke="#96A9BB"/>
<text x="308" y="366" text-anchor="middle" font-size="14" fill="#263446">只安排明确授权文件</text>
<text x="308" y="386" text-anchor="middle" font-size="14" fill="#263446">缺成品则列缺项</text>
</g>
<g class="node" data-id="e">
<rect x="94" y="491" width="232" height="58" rx="6" fill="white" stroke="#96A9BB"/>
<text x="210" y="515" text-anchor="middle" font-size="14" fill="#263446">上传指定项并回读结果</text>
<text x="210" y="535" text-anchor="middle" font-size="14" fill="#263446">原件不动时使用改名副本</text>
</g>
<g class="node" data-id="f">
<rect x="94" y="640" width="232" height="58" rx="6" fill="white" stroke="#96A9BB"/>
<text x="210" y="664" text-anchor="middle" font-size="14" fill="#263446">报告检查或试传结果</text>
<text x="210" y="684" text-anchor="middle" font-size="14" fill="#263446">列未做范围，保持节点未提交</text>
</g>
<g class="node" data-id="g">
<rect x="94" y="734" width="232" height="42" rx="21" fill="white" stroke="#96A9BB"/>
<text x="210" y="760" text-anchor="middle" font-size="14" fill="#263446">扩大范围后重建完整计划</text>
</g>
<text x="113" y="259" text-anchor="middle" font-size="12" fill="#465D72" stroke="white" stroke-width="3" paint-order="stroke">否</text>
<text x="259" y="289.68" text-anchor="middle" font-size="12" fill="#465D72" stroke="white" stroke-width="3" paint-order="stroke">是</text>
</g></svg>